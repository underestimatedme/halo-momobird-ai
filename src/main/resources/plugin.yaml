# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: momobird-ai
spec:
  enabled: true
  version: 0.1.1
  requires: ">=2.17.0"
  settingName: momobird-ai-settings
  configMapName: momobird-ai-configmap
  author:
    name: MomoBird
    website: https://momobird.atlaspaces.com
  logo: logo.png
  # The source repository is private: no repo or issues link (both optional in Halo's Plugin spec).
  homepage: https://momobird.atlaspaces.com/docs/halo
  displayName: "MomoBird AI"
  description: "把 Halo 文章同步到 MomoBird 知识库，并在站点上提供 AI 问答助手和文章播客。"
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.html"
