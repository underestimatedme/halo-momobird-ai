# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: momobird-ai
spec:
  enabled: true
  version: 0.1.0
  requires: ">=2.17.0"
  author:
    name: MomoBird
    website: https://momobird.com
  logo: logo.png
  homepage: https://github.com/underestimatedme/halo-momobird-ai#readme
  repo: https://github.com/underestimatedme/halo-momobird-ai
  issues: https://github.com/underestimatedme/halo-momobird-ai/issues
